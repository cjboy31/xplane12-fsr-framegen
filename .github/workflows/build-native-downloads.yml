name: Build native downloads (private source)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact current private beta SHA; empty for source-free runner smoke
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: native-downloads-${{ github.repository }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'cjboy31/xplane12-fsr-framegen' && github.actor == 'cjboy31'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-free runner smoke
        run: |
          set -eu
          uname -s
          python3 --version
          cmake --version | head -1
          echo 'PASS: native runner started; source-free smoke'
      - name: Checkout exact private Beta with temporary read-only key
        if: inputs.source_commit != ''
        env:
          READ_KEY: ${{ secrets.NATIVE_SOURCE_READ_KEY }}
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: |
          set -eu
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -n "$READ_KEY" || exit 1
          key="$RUNNER_TEMP/native-source-key"
          hosts="$RUNNER_TEMP/native-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$READ_KEY" > "$key"
          unset READ_KEY
          # Host keys come from GitHub's HTTPS metadata, not unauthenticated scan.
          curl --fail --silent --show-error https://api.github.com/meta > "$RUNNER_TEMP/github-meta.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); open(sys.argv[2],"w").write("".join("github.com "+k+"\n" for k in x["ssh_keys"]))' "$RUNNER_TEMP/github-meta.json" "$hosts"
          export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$hosts'"
          git init -q "$RUNNER_TEMP/native-source"
          cd "$RUNNER_TEMP/native-source"
          git remote add origin git@github.com:cjboy31/xplane12-fsr-framegen-source.git
          git fetch --quiet --depth=1 origin beta
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --quiet --detach FETCH_HEAD
          git remote remove origin
          echo 'PASS: exact private Beta checked out; read key removed before build'
      - name: Native Linux dependencies
        if: inputs.source_commit != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq > "$RUNNER_TEMP/dependencies.log" 2>&1
          sudo apt-get install -y cmake g++-12 libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers python3-tk xvfb >> "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Build and test privately; no compiler/source log output
        if: inputs.source_commit != ''
        env:
          CC: ${{ runner.os == 'Linux' && 'gcc-12' || 'clang' }}
          CXX: ${{ runner.os == 'Linux' && 'g++-12' || 'clang++' }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/native-source"
          if ! python3 -m unittest discover -s platform/tests -p test_core.py -v > "$RUNNER_TEMP/native-tests.log" 2>&1; then
            echo 'FAIL: launcher tests; private logs not uploaded'; exit 1
          fi
          if ! python3 platform/build_native.py --output "$RUNNER_TEMP/native-packages" > "$RUNNER_TEMP/native-build.log" 2>&1; then
            echo 'FAIL: native build/tests/package; private logs not uploaded'; exit 1
          fi
          echo 'PASS: native build, lifecycle, backend and package checks'
      - name: Independent binary-only archive gate
        if: inputs.source_commit != ''
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-packages'
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'checked-downloads'; out.mkdir()
          archives=list(root.glob('*.tar.gz'))+list(root.glob('*.zip')); assert len(archives)==1
          for archive in archives:
              if archive.suffix=='.zip':
                  with zipfile.ZipFile(archive) as z:
                      files={i.filename:z.read(i) for i in z.infolist() if not i.is_dir()}
              else:
                  with tarfile.open(archive) as z:
                      assert all(m.isfile() or m.isdir() for m in z.getmembers())
                      files={m.name:z.extractfile(m).read() for m in z.getmembers() if m.isfile()}
              allowed={'core.py','launcher.py','LICENSE.txt','INSTALLATION-AND-USE.txt','BUILD-INFO.json','PAYLOAD-SHA256SUMS.txt','Launch.command','Install-on-Mac.command','probe/64/mac.xpl','Launch-FSR','probe/64/lin.xpl','VkLayer_xplane_fsr3.json','libVkLayer_xplane_fsr3.so','licenses/X-Plane-SDK.txt','licenses/JonathanOrr-xplane-fsr3-MIT.txt','licenses/AMD-FidelityFX-MIT.txt','licenses/Khronos-Vulkan-Headers-MIT.txt'}
              payload={k.split('/',1)[1]:v for k,v in files.items()}
              assert len({k.split('/')[0] for k in files})==1
              assert set(payload)<=allowed and all('..' not in pathlib.PurePosixPath(k).parts for k in payload)
              info=json.loads(payload['BUILD-INFO.json']); assert info['source_commit']==os.environ['EXPECTED_SHA']
              lines=payload['PAYLOAD-SHA256SUMS.txt'].decode().splitlines(); listed=set()
              for line in lines:
                  digest,name=line.split('  ',1); assert name not in listed; listed.add(name)
                  assert hashlib.sha256(payload[name]).hexdigest()==digest
              assert listed==set(payload)-{'PAYLOAD-SHA256SUMS.txt'}
              digest=hashlib.sha256(archive.read_bytes()).hexdigest()
              (out/archive.name).write_bytes(archive.read_bytes())
              (out/(archive.name+'.sha256')).write_text(digest+'  '+archive.name+'\n')
              print('PASS:',archive.name,digest)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.source_commit != ''
        with:
          name: checked-native-${{ runner.os }}
          path: checked-downloads/*
          if-no-files-found: error
          retention-days: 3
